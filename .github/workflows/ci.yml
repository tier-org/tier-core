name: ci

# Build and test on every push to main and every pull request targeting it.
# This is the test gate; publishing a .deb is a separate, tag-only workflow
# (release.yml). Two jobs run in parallel:
#   - test: the fast unit/integration suite (ctest), Debug + sanitizers.
#   - e2e:  the Docker four-node dual-stack mesh gate (the same one release runs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Match the release runner so the test environment tracks what ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build
          # The hosted ubuntu-22.04 runner already provides CMake >= 3.25.

      # Debug build with the project defaults: AddressSanitizer +
      # UndefinedBehaviorSanitizer on, warnings as errors. This is stricter than
      # the release build (which turns both off) and is the point of the gate.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  e2e:
    # The Docker mesh runs a container-shaped binary, so this job builds the
    # static Release (sanitizers off) exactly as release.yml does - an ASan
    # Debug binary would not start in the thin ubuntu:22.04 image. Separate job
    # so the unit suite never waits on the Docker build.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTIER_SANITIZE=OFF \
            -DTIER_WERROR=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build -j

      - name: Enable Docker IPv6
        run: |
          sudo mkdir -p /etc/docker
          # Merge the IPv6 settings into any existing daemon.json rather than
          # overwriting it. ip6tables is still an EXPERIMENTAL daemon feature on
          # the runner's Docker (< 27), so "experimental" must be enabled too or
          # the daemon refuses to start.
          [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          merged="$(sudo jq '. + {experimental: true, ipv6: true, "fixed-cidr-v6": "fd00:d0cc::/64", ip6tables: true}' /etc/docker/daemon.json)"
          echo "$merged" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker \
            || { sudo journalctl -xeu docker.service --no-pager | tail -n 60; exit 1; }
          for _ in $(seq 1 15); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker info >/dev/null

      - name: E2E mesh gate
        env:
          TIERD_BIN: ${{ github.workspace }}/build/apps/node/tierd
          TIERCTL_BIN: ${{ github.workspace }}/build/apps/cli/tierctl
        run: ./test/net/e2e.sh

  fuzz:
    # libFuzzer targets for the untrusted-input decoders: membership, SWIM
    # control + admin, version, wire frame, and the sealed-message / enc_keys
    # decoder (fuzz_sealed also links tier::crypto, so it exercises the real
    # signature, KEM and AEAD open paths, not just the byte parse). libFuzzer
    # needs Clang. ASan + UBSan are on (TIER_SANITIZE) and the Tier libraries are
    # coverage-instrumented (TIER_FUZZ), so libFuzzer guides into the real
    # decoders and a memory or UB error aborts. A crash or sanitizer abort fails
    # the job. The corpus is cached across runs so coverage accumulates instead of
    # starting cold each time.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang

      - name: Configure
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTIER_FUZZ=ON \
            -DTIER_SANITIZE=ON \
            -DTIER_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build fuzz targets
        run: |
          cmake --build build-fuzz -j \
            --target fuzz_frame fuzz_membership fuzz_control fuzz_semver fuzz_sealed

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus
          # A fresh key each run (so the updated corpus is always saved), falling
          # back to the most recent prior corpus so coverage carries over.
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Run each fuzzer briefly
        run: |
          for t in fuzz_frame fuzz_membership fuzz_control fuzz_semver fuzz_sealed; do
            echo "== $t =="
            mkdir -p "fuzz-corpus/$t"
            ./build-fuzz/fuzz/"$t" -max_total_time=30 -print_final_stats=1 \
              "fuzz-corpus/$t"
          done

  tidy:
    # clang-tidy static-analysis gate over the project's own sources (libs/
    # and apps/; the check set and header filter live in .clang-tidy). A finding
    # fails the job: -warnings-as-errors promotes every enabled check to an
    # error even though .clang-tidy leaves WarningsAsErrors empty for advisory
    # local runs. Built with Clang (sanitizers off) so the compile database the
    # analyzer replays carries Clang-compatible flags; the build also generates
    # the configure-time headers (networks_table.hpp) and submodule headers that
    # the translation units include.
    #
    # ubuntu-24.04 (not -22.04 like the other jobs): it ships clang-tidy 18 and a
    # run-clang-tidy that accepts -warnings-as-errors. The 22.04 runner's LLVM 14
    # run-clang-tidy rejects that flag, and its older checks would differ anyway.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang clang-tidy

      - name: Configure
        run: |
          cmake -S . -B build-tidy -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTIER_SANITIZE=OFF \
            -DTIER_WERROR=OFF \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build-tidy -j

      - name: clang-tidy
        run: >
          run-clang-tidy -p build-tidy -quiet -warnings-as-errors='*'
          '(libs|apps)/.*\.cpp'
