name: release

# Build the static binary and publish a .deb to a GitHub Release whenever a
# version tag is pushed. Built on Ubuntu 22.04 so the glibc floor stays at 2.35
# (runs on 22.04 and 24.04).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The committed VERSION file is the single source of truth and must match
      # the tag being released. Bump both atomically with scripts/release.sh;
      # this guard fails the build if a tag was ever cut by hand out of sync.
      - name: Guard VERSION matches tag
        run: |
          file_ver="v$(head -n1 VERSION | tr -d '[:space:]')"
          if [ "$file_ver" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION ($file_ver) != release tag ($GITHUB_REF_NAME); bump via scripts/release.sh"
            exit 1
          fi

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build dpkg-dev file
          # The hosted ubuntu-22.04 runner already provides CMake >= 3.25.

      - name: Version from tag
        run: echo "TIER_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTIER_SANITIZE=OFF \
            -DTIER_WERROR=OFF \
            -DTIER_VERSION="$TIER_VERSION" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Pre-publish gate: a four-node dual-stack mesh must converge and advertise
      # both address families before the .deb is built. Needs Docker IPv6, which
      # the hosted runner does not enable by default.
      - name: Enable Docker IPv6
        run: |
          sudo mkdir -p /etc/docker
          # Merge the IPv6 settings into any existing daemon.json rather than
          # overwriting it (the hosted daemon may rely on other keys). ip6tables
          # is still an EXPERIMENTAL daemon feature on the runner's Docker
          # (< 27), so "experimental" must be enabled alongside it or the daemon
          # refuses to start - which is what failed before.
          [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
          merged="$(sudo jq '. + {experimental: true, ipv6: true, "fixed-cidr-v6": "fd00:d0ck::/64", ip6tables: true}' /etc/docker/daemon.json)"
          echo "$merged" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker \
            || { sudo journalctl -xeu docker.service --no-pager | tail -n 60; exit 1; }
          # Wait for the daemon to accept connections again before the gate runs.
          for _ in $(seq 1 15); do
            docker info >/dev/null 2>&1 && break
            sleep 1
          done
          docker info >/dev/null

      - name: E2E mesh gate
        env:
          TIERD_BIN: ${{ github.workspace }}/build/apps/node/tierd
          TIERCTL_BIN: ${{ github.workspace }}/build/apps/cli/tierctl
        run: ./test/net/e2e.sh

      - name: Package
        run: cd build && cpack -G DEB

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.deb --generate-notes
