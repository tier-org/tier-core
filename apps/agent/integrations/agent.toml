# tier-agent in the AGENT role: periodically collect host state and ship it to a
# collector over tier. Pairs with tier-agent@agent.service (serf-like node).
# Copy to /etc/tier/agent.toml and set `collector` before enabling the unit.
role = "agent"
admin_socket = "/run/tierd/tierd.sock"
seed_file = "/var/lib/tier-agent/agent-agent.seed"

[agent]
# Bootstrap substitutes the collector's Tier address. Set it when copying manually.
collector = "@COLLECTOR_ADDRESS@"
interval = 15
exec = "/usr/libexec/tier/host-metrics.sh"
